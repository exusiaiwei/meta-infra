# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# ================================================================================================
# meta-infra - Core: Base
# ================================================================================================
# 用途：核心基础工具，所有设备必装
# 优先级：🔴 最高
#
# 安装方式：
#   winget configure manifests/core/base.yaml --accept-configuration-agreements
#
# 包含工具（5个）：
#   - Git: 版本控制
#   - Mise: 环境与任务管理
#   - MSYS2: Zsh + Unix 工具链
#   - Starship: Shell 提示符美化
#   - Windows Terminal: 终端
# ================================================================================================

$schema: https://aka.ms/configuration-dsc-schema/0.2
properties:
  resources:
    # ========================================
    # Git - 版本控制
    # ========================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives:
        description: Install Git (Version Control System)
        allowPrerelease: false
      settings:
        id: Git.Git
        source: winget

    # ========================================
    # Mise - 环境与任务管理
    # ========================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: mise
      directives:
        description: Install Mise (Environment + Task Manager)
        allowPrerelease: false
      settings:
        id: jdx.mise
        source: winget

    # ========================================
    # MSYS2 - Zsh + Unix 工具链
    # ========================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: msys2
      directives:
        description: Install MSYS2 (Zsh + Unix Toolchain)
        allowPrerelease: false
      settings:
        id: MSYS2.MSYS2
        source: winget

    # ========================================
    # Starship - Shell 提示符
    # ========================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: starship
      directives:
        description: Install Starship (Cross-platform Prompt)
        allowPrerelease: false
      settings:
        id: Starship.Starship
        source: winget

    # ========================================
    # Windows Terminal
    # ========================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: windows_terminal
      directives:
        description: Install Windows Terminal
        allowPrerelease: false
      settings:
        id: Microsoft.WindowsTerminal
        source: winget
  configurationVersion: 0.2.0
