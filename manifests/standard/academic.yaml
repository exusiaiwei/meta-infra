# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# ================================================================================================
# meta-infra - Standard: Academic
# ================================================================================================
# 学术工具（笔记、文献管理、Office）
# 排版工具 (Typst/Quarto) 由 mise.toml 管理
# 优先级：推荐
# ================================================================================================

$schema: https://aka.ms/configuration-dsc-schema/0.2
properties:
  resources:
    # === Notes & Knowledge Management ===
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: obsidian
      settings:
        id: Obsidian.Obsidian
        source: winget

    # === Bibliography Management ===
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: zotero
      settings:
        id: DigitalScholar.Zotero
        source: winget

    # === Office ===
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: office365
      settings:
        id: Microsoft.Office
        source: winget

    # === 排版与文档 ===
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: quarto
      settings:
        id: Posit.Quarto
        source: winget
  configurationVersion: 0.2.0
