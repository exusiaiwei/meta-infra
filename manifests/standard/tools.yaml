# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# ================================================================================================
# meta-infra - Standard: Tools
# ================================================================================================
# 效率工具（系统增强、网络、浏览器、实用工具）
# 优先级：推荐
# ================================================================================================

$schema: https://aka.ms/configuration-dsc-schema/0.2
properties:
  resources:
    # === System Enhancement ===
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: powertoys
      settings:
        id: Microsoft.PowerToys
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: winget_autoupdate
      settings:
        id: Romanitho.Winget-AutoUpdate
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: files_app
      settings:
        id: 49306atecsolution.FilesUWP
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: windhawk
      settings:
        id: RamenSoftware.Windhawk
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: auto_dark_mode
      settings:
        id: ArminOsaj.AutoDarkMode
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: mactype
      settings:
        id: MacType.MacType
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: yasb
      settings:
        id: AmN.yasb
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: bitwarden
      settings:
        id: Bitwarden.Bitwarden
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: nanazip
      settings:
        id: M2Team.NanaZip
        source: winget

    # === Network & Proxy ===
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: clash_verge
      settings:
        id: ClashVergeRev.ClashVergeRev
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: tailscale
      settings:
        id: Tailscale.Tailscale
        source: winget

    # === Translation ===
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: pot
      settings:
        id: Pylogmon.pot
        source: winget

    # === File Tools ===
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: fastcopy
      settings:
        id: FastCopy.FastCopy
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: geek_uninstaller
      settings:
        id: GeekUninstaller.GeekUninstaller
        source: winget

    # === Browser ===
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: edge
      settings:
        id: Microsoft.Edge
        source: winget
  configurationVersion: 0.2.0
