# ================================================================================================
# meta-infra - Mise 任务配置
# ================================================================================================
# 用途：定义项目级别的自动化任务（Task Runner）
#
# 架构分工：
#   全局工具版本 → ~/.config/mise/config.toml（由 chezmoi 同步）
#   自动化任务   → 本文件（mise run install / verify / backup 等）
#   环境变量     → 本文件 [env] 区块
#
# 文档：https://mise.jdx.dev/
# ================================================================================================


# ========================================
# 设置
# ========================================
[settings]
# mise.exe 在 Windows 上默认用 cmd /c 执行 inline 任务，
# 但我们的任务全部用 zsh 语法（export, for, if 等），
# 所以必须显式指定用 MSYS2 的 zsh 来执行。
windows_default_inline_shell_args = "C:/msys64/usr/bin/zsh.exe -c"

# ========================================
# 环境变量
# ========================================
[env]
# 阻止 MSYS2 自动转换 winget 等命令的路径参数
MSYS2_ARG_CONV_EXCL = "*"

# ========================================
# 任务定义
# ========================================
# 架构：
#   PowerShell (引导层 - 裸机唯一可用) → Mise + Zsh (主体层)
#   init.ps1 只负责: 装 Git + MSYS2 + 克隆仓库
#   之后所有任务都由 zsh 脚本执行

# ========== 安装任务 ==========

[tasks.install]
description = "交互式安装 Winget 应用（选择模块）"
run = """
ROOT="${MISE_PROJECT_ROOT:-$(cd "$(dirname "$0")" && pwd)}"

echo '============================================'
echo '  📦 应用安装向导'
echo '============================================'
echo ''
echo '  [核心层] (推荐全装)'
echo '    1. core        - Git, MSYS2, Mise, Starship, Terminal, Clash Verge'
echo ''
echo '  [标准层] (按需选择)'
echo '    2. tools       - PowerToys, Bitwarden, NanaZip, FastCopy...'
echo '    3. dev         - VS Code, Cursor, Docker, GitHub CLI...'
echo '    4. academic    - Obsidian, Zotero...'
echo '    5. media       - PotPlayer, File Converter...'
echo '    6. communication - 微信, QQ, Teams...'
echo ''
echo '  [可选层]'
echo '    7. gaming      - Steam, Battle.net...'
echo ''
echo '  快捷选项:'
echo '    A. 全部安装 (1-6)'
echo '    Q. 退出'
echo ''
printf '请输入编号 (逗号分隔, 如 1,2,3): '
read choice

if [[ "$choice" == "Q" || "$choice" == "q" ]]; then
  echo '已跳过安装'
  exit 0
fi

# 展开快捷选项 A
if [[ "$choice" == "A" || "$choice" == "a" ]]; then
  choice="1,2,3,4,5,6"
fi

# 统一分隔符：中文逗号、空格、分号 → 英文逗号
choice=$(echo "$choice" | sed 's/，/,/g; s/；/,/g; s/ /,/g')

for c in ${(s:,:)choice}; do
  c=$(echo "$c" | tr -d ' ')
  case $c in
    1)
      echo ''
      echo '>> [1/核心层] core...'
      winget.exe configure "$ROOT/manifests/core/base.yaml" --accept-configuration-agreements
      ;;
    2)
      echo ''
      echo '>> [2/标准层] tools...'
      winget.exe configure "$ROOT/manifests/standard/tools.yaml" --accept-configuration-agreements
      ;;
    3)
      echo ''
      echo '>> [3/标准层] dev...'
      winget.exe configure "$ROOT/manifests/standard/dev.yaml" --accept-configuration-agreements
      ;;
    4)
      echo ''
      echo '>> [4/标准层] academic...'
      winget.exe configure "$ROOT/manifests/standard/academic.yaml" --accept-configuration-agreements
      ;;
    5)
      echo ''
      echo '>> [5/标准层] media...'
      winget.exe configure "$ROOT/manifests/standard/media.yaml" --accept-configuration-agreements
      ;;
    6)
      echo ''
      echo '>> [6/标准层] communication...'
      winget.exe configure "$ROOT/manifests/standard/communication.yaml" --accept-configuration-agreements
      ;;
    7)
      echo ''
      echo '>> [7/可选层] gaming...'
      winget.exe configure "$ROOT/manifests/optional/gaming.yaml" --accept-configuration-agreements
      ;;
    *)
      echo "   ⚠️  未知选项: $c"
      ;;
  esac
done

echo ''
echo '✅ 安装完成！'
"""

[tasks."install:core"]
description = "仅安装核心层（无交互）"
run = "winget.exe configure \"${MISE_PROJECT_ROOT}/manifests/core/base.yaml\" --accept-configuration-agreements"

[tasks."install:all"]
description = "安装全部（核心 + 标准层，无交互）"
run = """
ROOT="${MISE_PROJECT_ROOT:-$(cd "$(dirname "$0")" && pwd)}"
echo '>> 安装核心层...'
winget.exe configure "$ROOT/manifests/core/base.yaml" --accept-configuration-agreements
echo '>> 安装标准层...'
for f in "$ROOT"/manifests/standard/*.yaml; do
  echo "  安装: $(basename $f)"
  winget.exe configure "$f" --accept-configuration-agreements
done
echo '✅ 全部安装完成'
"""

# ========== 配置任务 ==========

[tasks.setup]
description = "完整配置向导（Git + Dotfiles + WSL）"
depends = ["setup:git", "setup:dotfiles"]
run = """
ROOT="${MISE_PROJECT_ROOT:-$(cd "$(dirname "$0")" && pwd)}"
echo ''
echo '是否配置 WSL 环境？'
read 'reply?[y/N] '
if [[ "$reply" =~ ^[Yy]$ ]]; then
  wsl.exe -e bash -c "$(cat "$ROOT/scripts/setup-wsl.sh")"
fi
echo ''
echo '✅ 所有配置完成！'
"""

[tasks."setup:git"]
description = "配置 Git 用户信息 + 生成 SSH 密钥"
run = "zsh \"${MISE_PROJECT_ROOT}/scripts/setup-git.sh\""

[tasks."setup:dotfiles"]
description = "同步 dotfiles（符号链接）"
run = "zsh \"${MISE_PROJECT_ROOT}/scripts/sync-dotfiles.sh\""

[tasks."setup:wsl"]
description = "一键配置 WSL 环境"
run = "wsl.exe -e bash -c \"$(cat \"${MISE_PROJECT_ROOT}/scripts/setup-wsl.sh\")\""

[tasks."setup:terminal"]
description = "将 zsh 添加到 Windows Terminal 并设为默认"
run = "zsh \"${MISE_PROJECT_ROOT}/scripts/setup-terminal.sh\""

# ========== 系统精调 ==========

[tasks.tweak]
description = "系统精调（去广告、去遥测、关 Copilot）— 调用 winutil"
run = "powershell.exe -Command \"irm https://christitus.com/win | iex\""

# ========== Antigravity 配置备份/恢复 ==========

[tasks."backup:antigravity"]
alias = "ba"
description = "导出 Antigravity 配置到 OneDrive（settings + keybindings + 扩展列表）"
run = """
AG_CONFIG="$HOME/AppData/Roaming/Antigravity/User"
AG_CLI="$HOME/AppData/Local/Programs/Antigravity/bin/antigravity.cmd"
BACKUP_DIR="$HOME/OneDrive - MSFT/Backup/Configs/antigravity"

if [[ ! -d "$AG_CONFIG" ]]; then
  echo "❌ Antigravity 配置目录不存在: $AG_CONFIG"
  exit 1
fi

mkdir -p "$BACKUP_DIR"

echo '>> 备份 settings.json...'
cp "$AG_CONFIG/settings.json" "$BACKUP_DIR/settings.json"

echo '>> 备份 keybindings.json...'
cp "$AG_CONFIG/keybindings.json" "$BACKUP_DIR/keybindings.json" 2>/dev/null || echo '   (跳过: keybindings.json 不存在)'

echo '>> 导出扩展列表...'
if [[ -f "$AG_CLI" ]]; then
  "$AG_CLI" --list-extensions 2>/dev/null | grep -v '^[[]' > "$BACKUP_DIR/extensions.txt"
else
  # 从扩展目录直接读取
  ls -d "$HOME/.antigravity/extensions"/*/ 2>/dev/null \
    | xargs -I{} basename {} \
    | sed 's/-[0-9].*$//' \
    > "$BACKUP_DIR/extensions.txt"
fi

count=$(wc -l < "$BACKUP_DIR/extensions.txt" 2>/dev/null || echo 0)
echo "✅ 备份完成 → $BACKUP_DIR"
echo "   settings.json + keybindings.json + $count 个扩展"
echo '   OneDrive 会自动同步到其他设备'
"""

[tasks."restore:antigravity"]
alias = "ra"
description = "从 OneDrive 恢复 Antigravity 配置（settings + keybindings + 安装扩展）"
run = """
AG_CONFIG="$HOME/AppData/Roaming/Antigravity/User"
AG_CLI="$HOME/AppData/Local/Programs/Antigravity/bin/antigravity.cmd"
BACKUP_DIR="$HOME/OneDrive - MSFT/Backup/Configs/antigravity"

if [[ ! -d "$BACKUP_DIR" ]]; then
  echo "❌ 备份目录不存在: $BACKUP_DIR"
  echo "   请先登录 OneDrive 并同步文件"
  exit 1
fi

mkdir -p "$AG_CONFIG"

echo '>> 恢复 settings.json...'
if [[ -f "$BACKUP_DIR/settings.json" ]]; then
  cp "$BACKUP_DIR/settings.json" "$AG_CONFIG/settings.json"
  echo '   ✅ settings.json'
fi

echo '>> 恢复 keybindings.json...'
if [[ -f "$BACKUP_DIR/keybindings.json" ]]; then
  cp "$BACKUP_DIR/keybindings.json" "$AG_CONFIG/keybindings.json"
  echo '   ✅ keybindings.json'
fi

echo '>> 安装扩展...'
if [[ -f "$BACKUP_DIR/extensions.txt" ]] && [[ -f "$AG_CLI" ]]; then
  total=$(wc -l < "$BACKUP_DIR/extensions.txt")
  i=0
  while IFS= read -r ext; do
    [[ -z "$ext" ]] && continue
    i=$((i + 1))
    echo "   [$i/$total] $ext"
    "$AG_CLI" --install-extension "$ext" --force 2>/dev/null || echo "   ⚠️  失败: $ext"
  done < "$BACKUP_DIR/extensions.txt"
  echo "   ✅ 扩展安装完成"
else
  echo '   ⚠️  跳过: extensions.txt 不存在或 Antigravity CLI 不可用'
fi

echo ''
echo '✅ 恢复完成！重启 Antigravity 以应用配置。'
"""

# ========== 维护任务 ==========

[tasks.status]
alias = "s"
description = "显示系统状态"
run = """
echo '============================================'
echo '  📊 系统状态'
echo '============================================'
echo ''
echo '>> Mise 工具:'
mise list 2>/dev/null || echo '  (mise 未安装)'
echo ''
echo '>> Git:'
echo "  user.name  = $(git config --global user.name 2>/dev/null || echo '未配置')"
echo "  user.email = $(git config --global user.email 2>/dev/null || echo '未配置')"
echo ''
echo '>> SSH:'
if [[ -f "$HOME/.ssh/id_ed25519.pub" ]]; then
  echo '  ✅ 密钥已存在'
else
  echo '  ❌ 未生成密钥'
fi
echo ''
echo '>> WSL:'
wsl.exe --status 2>/dev/null | head -5 || echo '  (WSL 未安装)'
"""

[tasks.update]
alias = "u"
description = "更新所有工具和包"
run = """
echo '>> 更新 Winget 应用...'
winget.exe upgrade --all --silent 2>/dev/null || true
echo ''
echo '>> 更新 Mise 工具...'
mise upgrade 2>/dev/null || true
echo ''
echo '✅ 更新完成'
"""

[tasks.verify]
alias = "v"
description = "验证所有依赖工具是否已正确安装"
run = """
echo '============================================'
echo '  🔍 安装验证'
echo '============================================'
echo ''
tools=("git" "mise" "zsh" "starship" "python3" "node" "pixi" "rg" "jq" "yq")
for tool in $tools; do
  if command -v $tool &>/dev/null; then
    version=$($tool --version 2>/dev/null | head -1)
    echo "  ✅ $tool: $version"
  else
    echo "  ❌ $tool: 未安装"
  fi
done
"""
