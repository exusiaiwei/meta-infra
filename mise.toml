# ================================================================================================
# meta-infra - Mise 配置文件
# ================================================================================================
# 用途：定义项目级别的任务和工具版本
# Mise 是整个项目的核心编排工具，负责：
#   1. 任务编排 (Task Runner)
#   2. 工具版本管理 (类似 Nvm/Pyenv/Rbenv)
#   3. 环境变量管理
#
# 架构：PowerShell (引导层) → Mise + Zsh (主体层)
# 文档：https://mise.jdx.dev/
# ================================================================================================

# ========================================
# 工具版本管理
# ========================================

[tools]
# --- 核心语言运行时 ---
python = "3.12"           # Python 解释器（固定版本，稳定）
node = "lts"              # Node.js LTS 版本

# --- 数据处理工具 ---
jq = "latest"             # JSON 查询和处理
yq = "latest"             # YAML/XML 查询和处理
ripgrep = "latest"        # 快速文本搜索（rg 命令）

# --- Python 包管理 ---
pixi = "latest"           # 现代 Python/Conda 包管理器

# --- AI CLI 工具（通过 npm 安装）---
"npm:@anthropic-ai/claude-code" = "latest"   # Claude Code CLI
"npm:@google/gemini-cli" = "latest"          # Gemini CLI

# --- 文档与排版（通过 ubi backend，从 GitHub releases 安装）---
"ubi:typst/typst" = "latest"                 # Typst 排版系统
"ubi:quarto-dev/quarto-cli" = "latest"       # Quarto 文档系统

# ========================================
# 环境变量
# ========================================
[env]
# EDITOR = "code"

# ========================================
# 任务定义
# ========================================
# 架构：
#   PowerShell (引导层 - 裸机唯一可用) → Mise + Zsh (主体层)
#   init.ps1 只负责: 装 Git + MSYS2 + 克隆仓库
#   之后所有任务都由 zsh 脚本执行

# ========== 安装任务 ==========

[tasks.install]
description = "安装所有 Winget 应用（核心 + 标准层）"
run = """
export MSYS2_ARG_CONV_EXCL="*"
ROOT="${MISE_PROJECT_ROOT:-$(cd "$(dirname "$0")" && pwd)}"
echo '>> 安装核心层...'
winget.exe configure "$ROOT/manifests/core/base.yaml" --accept-configuration-agreements
echo '>> 安装标准层...'
for f in "$ROOT"/manifests/standard/*.yaml; do
  echo "  安装: $(basename $f)"
  winget.exe configure "$f" --accept-configuration-agreements
done
echo '✅ 所有应用安装完成'
"""

[tasks."install:core"]
description = "仅安装核心层"
run = "export MSYS2_ARG_CONV_EXCL='*' && winget.exe configure \"${MISE_PROJECT_ROOT}/manifests/core/base.yaml\" --accept-configuration-agreements"

[tasks."install:optional"]
description = "安装可选模块（交互式选择）"
run = """
echo '可选模块:'
echo '  1. gaming     - 游戏平台'
echo '  2. security   - 火绒安全'
echo '  3. cloud      - 云存储'
echo '  4. nvidia     - NVIDIA 工具'
echo '  5. amd        - AMD 工具'
echo ''
read 'choice?请输入编号(逗号分隔): '
for c in ${(s:,:)choice}; do
  case $c in
    1) winget.exe configure manifests/optional/gaming.yaml --accept-configuration-agreements ;;
    2) winget.exe configure manifests/optional/security.yaml --accept-configuration-agreements ;;
    3) winget.exe configure manifests/optional/cloud.yaml --accept-configuration-agreements ;;
    4) winget.exe configure manifests/optional/hardware-nvidia.yaml --accept-configuration-agreements ;;
    5) winget.exe configure manifests/optional/hardware-amd.yaml --accept-configuration-agreements ;;
  esac
done
"""

# ========== 配置任务 ==========

[tasks.setup]
description = "完整配置向导（Git + Dotfiles + WSL）"
depends = ["setup:git", "setup:dotfiles"]
run = """
ROOT="${MISE_PROJECT_ROOT:-$(cd "$(dirname "$0")" && pwd)}"
echo ''
echo '是否配置 WSL 环境？'
read 'reply?[y/N] '
if [[ "$reply" =~ ^[Yy]$ ]]; then
  wsl.exe -e bash -c "$(cat "$ROOT/scripts/setup-wsl.sh")"
fi
echo ''
echo '✅ 所有配置完成！'
"""

[tasks."setup:git"]
description = "配置 Git 用户信息 + 生成 SSH 密钥"
run = "zsh \"${MISE_PROJECT_ROOT}/scripts/setup-git.sh\""

[tasks."setup:dotfiles"]
description = "同步 dotfiles（符号链接）"
run = "zsh \"${MISE_PROJECT_ROOT}/scripts/sync-dotfiles.sh\""

[tasks."setup:wsl"]
description = "一键配置 WSL 环境"
run = "wsl.exe -e bash -c \"$(cat \"${MISE_PROJECT_ROOT}/scripts/setup-wsl.sh\")\""

# ========== 系统精调 ==========

[tasks.tweak]
description = "系统精调（去广告、去遥测、关 Copilot）— 调用 winutil"
run = "powershell.exe -Command \"irm https://christitus.com/win | iex\""

# ========== 维护任务 ==========

[tasks.status]
description = "显示系统状态"
run = """
echo '============================================'
echo '  📊 系统状态'
echo '============================================'
echo ''
echo '>> Mise 工具:'
mise list 2>/dev/null || echo '  (mise 未安装)'
echo ''
echo '>> Git:'
echo "  user.name  = $(git config --global user.name 2>/dev/null || echo '未配置')"
echo "  user.email = $(git config --global user.email 2>/dev/null || echo '未配置')"
echo ''
echo '>> SSH:'
if [[ -f "$HOME/.ssh/id_ed25519.pub" ]]; then
  echo '  ✅ 密钥已存在'
else
  echo '  ❌ 未生成密钥'
fi
echo ''
echo '>> WSL:'
wsl.exe --status 2>/dev/null | head -5 || echo '  (WSL 未安装)'
"""

[tasks.update]
description = "更新所有工具和包"
run = """
echo '>> 更新 Winget 应用...'
winget.exe upgrade --all --silent 2>/dev/null || true
echo ''
echo '>> 更新 Mise 工具...'
mise upgrade 2>/dev/null || true
echo ''
echo '✅ 更新完成'
"""

[tasks.verify]
description = "验证所有依赖工具是否已正确安装"
run = """
echo '============================================'
echo '  🔍 安装验证'
echo '============================================'
echo ''
tools=("git" "mise" "zsh" "starship" "python3" "node" "pixi" "rg" "jq" "yq")
for tool in $tools; do
  if command -v $tool &>/dev/null; then
    version=$($tool --version 2>/dev/null | head -1)
    echo "  ✅ $tool: $version"
  else
    echo "  ❌ $tool: 未安装"
  fi
done
"""

# ========================================
# 任务别名
# ========================================
[alias]
s = "status"
u = "update"
v = "verify"
